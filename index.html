<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
#side,.scrim{-webkit-user-select:none;user-select:none}
:root{--bg:#F7F7F8;--sf:#FFFFFF;--sf2:#EFEFF1;--bd:#E1E2E5;--tx:#0B0C0E;--mu:#5B5E66;--ac:#7F6E5C;--on:#FFFFFF;--dg:#B3261E;--knob:#FFFFFF}
:root[data-theme=dark]{color-scheme:dark;--bg:#0B0C0E;--sf:#141518;--sf2:#1C1D21;--bd:#2B2D33;--tx:#F7F7F8;--mu:#A4A7AF;--ac:#B1A291;--on:#0B0C0E;--dg:#F2A19B;--knob:#F7F7F8}
html{height:100%}
body{height:100%;font:400 16px/24px Geist,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus,input:focus-visible,select:focus,select:focus-visible,textarea:focus,textarea:focus-visible,[contenteditable]:focus,[contenteditable]:focus-visible{outline:none;box-shadow:none}
#title:focus,#title:focus-visible{outline:none}
[hidden]{display:none!important}
*{transition:background-color .25s ease,color .25s ease,border-color .25s ease,opacity .2s ease,box-shadow .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
#ed,#sv,#edi,#ede{animation:fi .28s ease}
#sv.nofi{animation:none}
#act,#mm{animation:pop .16s ease;transform-origin:top right}
#fmt{animation:fi .2s ease}
dialog[open]{animation:pop .2s ease}
.ni,.nv,.b,.ib,.tbb,.mi,.row,.fab{transition:background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease,transform .15s ease,box-shadow .2s ease}
.b:active,.ib:active,.tbb:active,.fab:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
[data-anim=off] *,[data-anim=off] *:before,[data-anim=off] *:after{transition:none!important;animation:none!important}
#app{display:grid;grid-template-columns:260px 1fr;height:var(--vvh,100%);top:var(--vvt,0px);position:relative;overflow:hidden}
#listp,#sv{touch-action:pan-y}
html,body{overscroll-behavior:none}
.pgv{position:absolute;inset:0;overflow:hidden;background:var(--bg);pointer-events:none;z-index:3;will-change:transform}
.pgv *{animation:none!important}
.pgv>#listp{height:100%}
.pgv>#sv{position:absolute;inset:0;padding:0;z-index:auto}
.b{height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.b:hover{background:var(--sf2)}
.b[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--on)}
.b:disabled{opacity:.4;cursor:default}
.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.pri:hover{background:var(--ac);opacity:.9}
.dg{color:var(--dg)}
.mo{display:none}
.b.av,.b.ic{width:36px;padding:0;justify-content:center;align-items:center;display:inline-flex}
.b.av{border-radius:50%;background:var(--sf2);color:var(--mu)}
.b.ic{flex:none;border-radius:50%}
.lh .b.ic,.lh .b.av{width:44px;height:44px}
.lh .b.ic svg,.lh .b.av svg{width:22px;height:22px}
#mb,.thb{border-color:transparent;background:transparent}
#mb:hover,.thb:hover{background:var(--sf2)}
#sall[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 22%,transparent);border-color:transparent;color:var(--ac)}
.b.mo{display:none}
#empty{flex:1;justify-content:center}
.pf{display:flex;align-items:center;gap:12px;min-width:0}
.lk{display:inline-flex;align-items:center;gap:.5em;color:var(--tx);font-weight:600;letter-spacing:-.015em;line-height:1;white-space:nowrap;min-width:0}
.lks{height:1.2em;width:1.2em;flex:none;fill:currentColor;display:block}
.lkt{overflow:hidden;text-overflow:ellipsis}
.lkb{flex:none;width:auto;height:44px;padding:0 4px;border:0;border-radius:8px;background:none;box-shadow:none;font-size:20px}
#vt{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:var(--mu)}
#vt:empty{display:none}
.sph .lk{font-size:20px}
.sthb .lk{font-size:20px}
.pav{width:52px;height:52px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none;overflow:hidden}
.un{font-size:18px;line-height:24px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* settings */
#sv{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#sv{top:var(--vvt,0px);height:var(--vvh,auto)}
.svh{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
#svb{width:48px;height:48px;background:var(--sf)}
.svh h2{flex:1;font-size:22px;line-height:28px;font-weight:600}
.b.ic.thb{width:44px;height:44px}
.thb svg{width:22px;height:22px}
#psave{position:fixed;top:calc(var(--vvt,0px) + var(--vvh,var(--vh,100vh)) - 64px - env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:min(528px,calc(100% - 32px));height:48px;border-radius:14px;font-size:16px;z-index:2}
.card.pcard{padding:24px 20px 28px;gap:18px;align-items:center}
.pcard .fl{align-self:stretch}
.pcard .fl input{background:var(--bg)}
.pcard .b.pri{height:44px;padding:0 40px;font-size:16px;border-radius:12px}
dialog.sheet{inset:auto 0 0 0;margin:0 auto 12px;width:min(560px,calc(100% - 24px));border-radius:28px;padding:24px 20px 20px;text-align:left;display:none}
dialog.sheet[open]{display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
dialog.sheet h2{margin:0 0 4px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sr2{height:56px;border-radius:14px;background:var(--bg);padding:0 20px;text-align:left;font-size:17px;width:100%}
.sr2:disabled{opacity:.4;cursor:default}
.sa{display:flex;justify-content:flex-end}
.sa .b{height:48px;padding:0 28px;border-radius:14px;background:var(--bg);border-color:transparent;font-size:16px}
.svc[data-p=profile]{padding-top:24px;padding-bottom:104px}
#sv.kb .svc{padding-bottom:calc(var(--vh,100vh)*.6)}
.svc{flex:1;overflow-y:auto;padding:16px 16px 32px;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.svc>*{flex:none}
.sth{display:flex;align-items:center;gap:8px;min-width:0}
.sthb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.sthb .un{flex:1;font-size:20px;line-height:26px;min-width:0}
.sthb .pav{width:36px;height:36px}
.stt{font-size:18px;line-height:24px;font-weight:600;padding-top:8px}
.card{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:4px 17px}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:69px;padding:13px 0;text-align:left}
.row+.row,.fq+.fq{border-top:1px solid var(--bd)}
.row:hover{opacity:.85}
.ri{display:flex;flex:none;color:var(--mu)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-size:15px;line-height:22px;font-weight:500}
.rt small{font-size:13px;line-height:19px;color:var(--mu)}
.ch{display:flex;flex:none;color:var(--mu)}
.row.dg .ri,.row.dg .rt b{color:var(--dg)}
.row.dg .rt small{color:var(--dg);opacity:.8}
.row.tg{gap:16px}
.sw{flex:none;position:relative;width:42px;height:24px;border-radius:12px;background:var(--bd)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease,background-color .2s ease}
[aria-checked=true]>.sw{background:var(--ac)}
[aria-checked=true]>.sw:after{transform:translateX(18px);background:var(--on)}
.ck2{display:flex;flex:none;color:var(--ac);opacity:0}
[aria-checked=true] .ck2{opacity:1}
.di{font-size:14px;line-height:20px;color:var(--mu);padding:0 4px}

function curList(){const el=elOf(getSelection().anchorNode),l=el&&el.closest('ul,ol');return l&&E.contains(l)?l:null}

 groups.forEach((items,list)=>{if(listType(list)===type)return;
  const after=[];for(let x=items[items.length-1].nextElementSibling;x;x=x.nextElementSibling)after.push(x);
  const mid=mkList(type);items.forEach(i=>mid.appendChild(i));list.after(mid);
  if(after.length){const tail=list.cloneNode(false);tail.removeAttribute('start');after.forEach(x=>tail.appendChild(x));mid.after(tail)}
  if(!list.children.length)list.remove()});
 mergeLists();
 if(sv)try{const nr=document.createRange();nr.setStart(sv[0],sv[1]);nr.setEnd(sv[2],sv[3]);s.removeAllRanges();s.addRange(nr)}catch(x){}}

  {const s0=getSelection(),r0=s0.rangeCount?s0.getRangeAt(0):null,sv=r0?[r0.startContainer,r0.startOffset,r0.endContainer,r0.endOffset]:null;

  lis=selLis();

  if(!lis.length){const el=elOf(getSelection().anchorNode),li=el&&el.closest('li');if(li&&E.contains(li)&&li.parentElement.parentElement===E)lis=[li]}
  if(!lis.length)return}
